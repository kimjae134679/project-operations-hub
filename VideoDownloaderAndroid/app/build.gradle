plugins { id 'com.android.application' }
android {
    namespace 'kr.co.kjw.videodownloader'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'kr.co.kjw.videodownloader'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    splits { abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64'; universalApk false } }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
}
